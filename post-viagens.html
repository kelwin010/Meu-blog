<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viagens - Meu Blog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Meu Blog</a>
        <nav class="main-nav">
          <a href="posts.html">Posts</a>
          <a href="index.html#sobre">Sobre</a>
        </nav>
      </div>
    </header>

    <main class="container trips-page">
      <div class="page-intro">
        <h1>Minhas viagens</h1>
        <p>Aqui você pode ver um pouco das minhas experiências por diferentes lugares, com fotos que contam um pouco da minha jornada.</p>
      </div>

      <section class="gallery-grid" aria-label="Galeria de viagens">
        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=serra">
            <img class="gallery-photo photo-tall" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Pico coberto por neblina entre montanhas" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Serra da Bocaina</strong>
            <span>Uma manhã de céu limpo e uma trilha que parecia levar direto para o horizonte.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=praia">
            <img class="gallery-photo" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Praia com ondas claras e um pôr do sol dourado" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Praia do Sol</strong>
            <span>O pôr do sol desenhou um céu em tons de laranja e rosa sobre o mar.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=cidade">
            <img class="gallery-photo photo-wide" src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=900&q=80" alt="Rua movimentada de uma cidade com prédios modernos" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Rotas da cidade</strong>
            <span>As ruas cheias de vida e a energia de cada esquina fizeram a viagem valer ainda mais.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=aldeia">
            <img class="gallery-photo photo-tall" src="https://images.unsplash.com/photo-1527631746610-bca00a040d60?auto=format&fit=crop&w=900&q=80" alt="Aldeia cercada por natureza e casas acolhedoras" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Village escondida</strong>
            <span>Pequenas casas, silêncio e uma paisagem que parecia tirada de um conto.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=campo">
            <img class="gallery-photo" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Campo aberto com colinas verdes e céu azul" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Campos verdes</strong>
            <span>O vento e a paisagem ampla fizeram deste lugar um momento de paz.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=ponte">
            <img class="gallery-photo photo-wide" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Ponte sobre rio cercada por vegetação" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Ponte sobre o rio</strong>
            <span>A vista do rio e da ponte ficou marcada pela calma do lugar.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=floresta">
            <img class="gallery-photo photo-tall" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Floresta com árvores altas e luz filtrada" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Floresta serena</strong>
            <span>O som da natureza e a sombra das árvores tornaram o momento especial.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=mirante">
            <img class="gallery-photo" src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80" alt="Mirante com vista ampla para o vale" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Mirante do vale</strong>
            <span>Da altura, a paisagem parecia se estender sem fim.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=cafe">
            <img class="gallery-photo photo-wide" src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80" alt="Mesa com café e paisagem ao fundo" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Café da manhã em viagem</strong>
            <span>Um momento simples, mas cheio de calma e sabor.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=estrada">
            <img class="gallery-photo photo-tall" src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=900&q=80" alt="Estrada de montanha com curvas e árvores" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Estrada da aventura</strong>
            <span>Cada curva desta estrada trouxe uma nova surpresa e uma nova vista.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=lagoa">
            <img class="gallery-photo" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80" alt="Lagoa rodeada por montanhas e vegetação" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Lagoa azul</strong>
            <span>A água cristalina e as montanhas ao redor deixaram o lugar ainda mais encantador.</span>
          </figcaption>
        </article>

        <article class="gallery-card">
          <a class="gallery-link" href="viagem-detalhe.html?foto=festival">
            <img class="gallery-photo photo-wide" src="https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=900&q=80" alt="Festival ao ar livre com pessoas celebrando" loading="lazy" />
          </a>
          <figcaption class="gallery-caption">
            <strong>Festival à noite</strong>
            <span>A energia da festa e a iluminação transformaram a noite em um momento inesquecível.</span>
          </figcaption>
        </article>
      </section>

      <div class="page-actions">
        <a class="button" href="posts.html">Voltar para os posts</a>
        <a class="button button-secondary" href="index.html">Voltar ao início</a>
      </div>
    </main>
  </body>
</html>
